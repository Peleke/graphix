# ============================================================================
# GRAPHIX DOCKER COMPOSE - For the containerized scallywags 🏴‍☠️🐳
# ============================================================================
#
# Usage:
#   docker compose up        - Start all services
#   docker compose up -d     - Start in background
#   docker compose down      - Stop all services
#   docker compose logs -f   - Tail logs
#
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Backend API Server
  # --------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=file:./data/graphix.db
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - ./data:/app/data
      - ./packages/server/src:/app/packages/server/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - graphix-network

  # --------------------------------------------------------------------------
  # Web UI (Development)
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: packages/ui/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3002
    volumes:
      - ./packages/ui/src:/app/packages/ui/src:ro
      - ./packages/ui/index.html:/app/packages/ui/index.html:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - graphix-network

  # --------------------------------------------------------------------------
  # Schemathesis Fuzz Testing (Optional)
  # --------------------------------------------------------------------------
  fuzz:
    image: schemathesis/schemathesis:stable
    profiles:
      - testing
    command: >
      run
      --base-url http://server:3002/api
      --hypothesis-max-examples 50
      http://server:3002/api/docs/spec.json
    depends_on:
      server:
        condition: service_healthy
    networks:
      - graphix-network

networks:
  graphix-network:
    driver: bridge

# ============================================================================
# VOLUMES (for persistent data)
# ============================================================================
volumes:
  graphix-data:
