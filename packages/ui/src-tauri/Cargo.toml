[package]
name = "graphix"
version = "0.1.0"
description = "AI-native graphic novel and comic creation tool"
authors = ["Graphix Team"]
edition = "2021"
license = "MIT"

[lib]
name = "graphix_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
